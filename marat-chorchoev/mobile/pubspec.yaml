name: fixflow_mobile
description: FixFlow technician app (Android). Offline-first job notes and evidence.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# State management: Riverpod (Notifier/AsyncNotifier, no code generation).
# Local persistence: JSON file store with atomic writes (see lib/core/store.dart).
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
