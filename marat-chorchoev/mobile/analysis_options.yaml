include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
  errors:
    # Flutter 3.50 deprecates package:flutter/material.dart in favour of the separate
    # material_ui package. Migrating is mechanical but out of scope for this submission
    # (listed in docs/KNOWN_LIMITATIONS.md); every other lint stays enforced.
    deprecated_member_use: ignore

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
